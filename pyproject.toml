[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helm4-ready"
version = "0.3.0"
description = "Find what breaks when CI moves from Helm 3 to Helm 4 without running Helm: removed and deprecated CLI flags, executable post-renderers, registry login URLs, and the dated Helm 3 end of life. Checked against real Helm 3.22.0 and 4.3.0. SARIF and GitHub Action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Arslan", email = "cosmichackerx@users.noreply.github.com" }]
keywords = ["helm", "helm4", "helm-4", "helm3", "kubernetes", "ci", "github-actions", "makefile", "post-renderer", "oci", "registry-login", "end-of-life", "migration", "lint", "linter", "sarif", "deprecation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/cosmichackerx/helm4-ready"
Issues = "https://github.com/cosmichackerx/helm4-ready/issues"

[project.scripts]
helm4-ready = "helm4_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
