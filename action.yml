name: helm4-ready
description: "Find Helm 3 CLI usage that Helm 4 rejects in CI workflows, scripts and Makefiles, plus the Helm 3 EOL date. Tested on real Helm."
author: cosmichackerx
branding:
  icon: anchor
  color: blue
inputs:
  path:
    description: "Directory (or one file) to scan: workflows, scripts, Makefiles, Dockerfiles."
    default: "."
  fail-on:
    description: "Lowest severity that fails the step: error, warning or never."
    default: error
  disable:
    description: "Space- or newline-separated rule ids to turn off."
    default: ""
  ignore:
    description: "Space- or newline-separated path globs to leave out."
    default: ""
  summary:
    description: "Append a Markdown report to the job summary (true or false)."
    default: "true"
  pr-mode:
    description: "true: on pull requests report only findings the pull request introduces (git history needed: actions/checkout with fetch-depth: 0). Ignored outside pull requests unless `base` is set."
    default: "false"
  base:
    description: "Git revision to compare with in PR mode. Defaults to the pull request base SHA."
    default: ""
  comment:
    description: "Post the Markdown report as one sticky pull request comment, updated in place on every run (true or false). Needs pull-requests: write; skipped for forks."
    default: "false"
  github-token:
    description: "Token used for the sticky comment."
    default: ${{ github.token }}
  sarif-file:
    description: "Also write a SARIF 2.1.0 report here (upload it with github/codeql-action/upload-sarif)."
    default: ""
runs:
  using: composite
  steps:
    - name: Run helm4-ready
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_DISABLE: ${{ inputs.disable }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
        INPUT_PR_MODE: ${{ inputs.pr-mode }}
        INPUT_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if command -v python3 > /dev/null 2>&1 && python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)"; then py=python3; else py=python; fi
        export PYTHONPATH="$ACTION_DIR/src"
        common=("$INPUT_PATH")
        read -r -a rules <<< "$INPUT_DISABLE"
        for r in "${rules[@]}"; do common+=(--disable "$r"); done
        read -r -a globs <<< "$INPUT_IGNORE"
        for g in "${globs[@]}"; do common+=(--ignore "$g"); done
        if { [ "$INPUT_PR_MODE" = "true" ] && [ -n "$INPUT_BASE" ]; }; then common+=(--base "$INPUT_BASE"); fi
        if [ "$INPUT_COMMENT" = "true" ]; then
          report="${RUNNER_TEMP:-/tmp}/helm4-ready-comment.md"
          "$py" -m helm4_ready "${common[@]}" --format markdown --fail-on never > "$report" || true
          "$py" -m helm4_ready.comment "$report"
        fi
        if [ -n "$INPUT_SARIF" ]; then
          "$py" -m helm4_ready "${common[@]}" --format sarif --output "$INPUT_SARIF" --fail-on never
        fi
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          "$py" -m helm4_ready "${common[@]}" --format markdown --fail-on never >> "$GITHUB_STEP_SUMMARY"
        fi
        "$py" -m helm4_ready "${common[@]}" --format github --fail-on "$INPUT_FAIL_ON"
