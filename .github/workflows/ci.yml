name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-metadata:
    name: action.yml metadata (Marketplace limits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: name, description (max 125 characters) and branding are present and valid
        run: |
          python3 - <<'PY'
          import re
          t = open("action.yml", encoding="utf-8").read()
          name = re.search(r"^name:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          desc = re.search(r"^description:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          icon = re.search(r"^  icon:\s*(\S+)", t, re.M)
          color = re.search(r"^  color:\s*(\S+)", t, re.M)
          assert name, "name missing"
          assert 0 < len(desc) <= 125, f"description is {len(desc)} characters; the Marketplace allows at most 125"
          assert icon and color, "branding icon and color are required"
          assert color.group(1) in {"white", "black", "yellow", "blue", "green", "orange", "red", "purple", "gray-dark"}, color.group(1)
          print(f"ok: {name!r}, description {len(desc)} characters, icon {icon.group(1)}, color {color.group(1)}")
          PY

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - name: Installed CLI runs
        run: |
          helm4-ready --version
          helm4-ready --list-rules

  oracle:
    # Every claim of the form "Helm 4 rejects X" is run against real Helm binaries (no cluster needed). See tests/oracle/run_oracle.py.
    name: oracle (real Helm 3.22.0 and 4.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download Helm 3.22.0 and 4.3.0 (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/helm3" "$RUNNER_TEMP/helm4"
          curl -fsSL -o "$RUNNER_TEMP/h3.tgz" "https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/h4.tgz" "https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/h3.tgz" | sha256sum -c -
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/h4.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/h3.tgz" -C "$RUNNER_TEMP/helm3" --strip-components=1
          tar -xzf "$RUNNER_TEMP/h4.tgz" -C "$RUNNER_TEMP/helm4" --strip-components=1
      - name: helm4-ready agrees with the real binaries
        run: python tests/oracle/run_oracle.py --helm3 "$RUNNER_TEMP/helm3/helm" --helm4 "$RUNNER_TEMP/helm4/helm" --markdown "$RUNNER_TEMP/oracle.md"
      - name: Show the table
        if: always()
        run: cat "$RUNNER_TEMP/oracle.md" >> "$GITHUB_STEP_SUMMARY" || true

  oracle-matrix:
    # The same cases on every Helm 4 release (4.0.0 to 4.3.0) so that a rule is only claimed for releases it was run on. See docs/oracle-matrix.md.
    name: oracle matrix (Helm 3.22.0 and all 15 Helm 4 releases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download every Helm release (SHA-256 pinned in tests/oracle/helm-sha256.txt)
        run: python tests/oracle/fetch_helm.py "$RUNNER_TEMP/helm"
      - name: Run the cases on all of them; fail on any difference rules.py does not document
        run: |
          extras=()
          for v in 4.0.0 4.0.1 4.0.2 4.0.4 4.0.5 4.1.0 4.1.1 4.1.3 4.1.4 4.2.0 4.2.1 4.2.2 4.2.3 4.2.4; do extras+=(--extra-helm4 "$RUNNER_TEMP/helm/v$v/helm"); done
          python tests/oracle/run_oracle.py --helm3 "$RUNNER_TEMP/helm/v3.22.0/helm" --helm4 "$RUNNER_TEMP/helm/v4.3.0/helm" "${extras[@]}" --strict-extra --matrix "$RUNNER_TEMP/matrix.md"
      - name: Run the fixer's output (--fix --target 4) on all of them; every fixed command must be accepted without a notice
        run: |
          extras=()
          for v in 4.0.0 4.0.1 4.0.2 4.0.4 4.0.5 4.1.0 4.1.1 4.1.3 4.1.4 4.2.0 4.2.1 4.2.2 4.2.3 4.2.4; do extras+=(--extra-helm4 "$RUNNER_TEMP/helm/v$v/helm"); done
          python tests/oracle/run_fix_oracle.py --helm3 "$RUNNER_TEMP/helm/v3.22.0/helm" --helm4 "$RUNNER_TEMP/helm/v4.3.0/helm" "${extras[@]}"
      - name: Show the matrix
        if: always()
        run: cat "$RUNNER_TEMP/matrix.md" >> "$GITHUB_STEP_SUMMARY" || true

  action:
    name: action (this checkout, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Migrated fixture passes
        uses: ./
        with:
          path: tests/fixtures/clean-ci
          fail-on: warning
          sarif-file: ${{ runner.temp }}/helm4.sarif
      - name: Legacy fixture fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/legacy-ci
      - name: It really failed
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: SARIF was written
        run: python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version']=='2.1.0'" "$RUNNER_TEMP/helm4.sarif"

  package:
    name: build wheel and sdist, install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/helm4-ready tests/fixtures/clean-ci

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.1
        with:
          fail-on: warning
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  node24-ready:
    name: node24-ready (this repository's workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/node24-ready@v0.7.0
        with:
          path: .github action.yml
          fail-on: error

  claims:
    name: README claims (claims-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - uses: cosmichackerx/claims-check@v0.1.0

  released-action:
    name: released action (consumer test, v0.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migrated fixture passes with the published tag
        uses: cosmichackerx/helm4-ready@v0.1.0
        with:
          path: tests/fixtures/clean-ci
          fail-on: warning
      - name: Legacy fixture fails with the published tag
        id: bad
        continue-on-error: true
        uses: cosmichackerx/helm4-ready@v0.1.0
        with:
          path: tests/fixtures/legacy-ci
      - name: It really failed
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: Remote pre-commit hook at the published tag (migrated fixture passes)
        run: |
          pip install pre-commit
          work="$RUNNER_TEMP/pcr"; rm -rf "$work"; mkdir -p "$work"
          cp -r tests/fixtures/clean-ci/. "$work/"
          cd "$work" && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m fixture
          pre-commit try-repo https://github.com/cosmichackerx/helm4-ready helm4-ready --ref v0.1.0 --all-files

  pre-commit:
    name: pre-commit hook (try-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pre-commit
      - name: Hook passes on the migrated fixture and fails on the legacy one
        run: |
          work="$RUNNER_TEMP/pc"
          rm -rf "$work"; mkdir -p "$work/clean" "$work/legacy"
          cp -r tests/fixtures/clean-ci/. "$work/clean/"
          cp -r tests/fixtures/legacy-ci/. "$work/legacy/"
          for d in clean legacy; do
            (cd "$work/$d" && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m fixture)
          done
          (cd "$work/clean" && pre-commit try-repo "$GITHUB_WORKSPACE" helm4-ready --all-files)
          if (cd "$work/legacy" && pre-commit try-repo "$GITHUB_WORKSPACE" helm4-ready --all-files); then echo "the hook should fail on the legacy fixture"; exit 1; fi

  comment-selftest:
    name: PR mode and sticky comment (same-repo pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: First run creates the comment
        uses: ./
        with:
          path: tests/fixtures/legacy-ci
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Second run updates the same comment
        uses: ./
        with:
          path: tests/fixtures/legacy-ci
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Exactly one sticky comment exists, and it is a PR mode report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments"
          n="$(gh api "$url" --paginate --jq '[.[] | select(.body | startswith("<!-- helm4-ready:sticky -->"))] | length' | awk '{s+=$1} END{print s+0}')"
          m="$(gh api "$url" --paginate --jq '[.[] | select((.body | startswith("<!-- helm4-ready:sticky -->")) and (.body | contains("introduced since")))] | length' | awk '{s+=$1} END{print s+0}')"
          echo "sticky comments: $n, PR-mode ones: $m"
          test "$n" = "1" && test "$m" = "1"
