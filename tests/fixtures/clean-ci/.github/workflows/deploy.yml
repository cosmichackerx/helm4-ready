name: deploy
on: push
env:
  HELM_VERSION: v4.3.0
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - run: echo "$TOKEN" | helm registry login ghcr.io -u acme --password-stdin
      - run: |
          helm upgrade --install app ./chart \
            --namespace prod --rollback-on-failure --wait --timeout 5m
          helm list --deployed --failed -n prod
          helm template app ./chart --dry-run=server
